# Source endpoints and request settings.
# Values marked VERIFY must be confirmed with a live request during the ticket and the result noted in the PR.

http:
  timeout_seconds: 120
  max_retries: 3
  backoff_factor: 2            # waits 2, 4, 8 s
  retry_on_status: [429, 500, 502, 503, 504]
  user_agent: "wq-hotspot-pipeline (university project)"

owq:
  site_url: https://openwaterquality.org/
  export_mode: scripted        # confirmed via ING-2 spike
  export_endpoint: "https://lume-inventory-api.evan-thomas-3d8.workers.dev/api/wq/export"
  row_cap: 100000              # confirmed via ING-2 spike (X-Row-Count / X-Row-Capped response headers)
  sources:                     # source_code -> label used by the OWQ "Source" filter
    owq_gemstat: GEMStat
    owq_eionet: Eionet
  indicators:                  # friendly name -> `var` query param code (confirmed ING-2)
    ecoli: ecoli
    enterococci: entero
    fecal_coliform: fc
    total_coliform: tc
  loc_types:
    - canal
    - ditch
    - estuary
    - lake
    - ocean
    - other
    - pond
    - reservoir
    - "river/stream"
    - spring
    - wetland
  landing_subdir: landing/owq  # relative to DATA_DIR — unused now export_mode is scripted; kept as a documented fallback
  landing_filename_pattern: "owq_{source_code}_{start_year}-{end_year}.{ext}"   # ext: zip | csv | geojson

wqp:
  docs_url: https://www.waterqualitydata.us/webservices_documentation/
  station_url: https://www.waterqualitydata.us/data/Station/search
  result_url: https://www.waterqualitydata.us/data/Result/search
  summary_url: https://www.waterqualitydata.us/data/summary/monitoringLocation/search
  codes_url: https://www.waterqualitydata.us/Codes   # e.g. /Codes/Characteristicname?text=coli&mimeType=json
  countrycode: US
  # indicator_code -> exact, case-sensitive WQP characteristicName. VERIFY via Codes/Characteristicname.
  characteristic_map:
    e_coli: "Escherichia coli"
    enterococci: "Enterococcus"
    fecal_coliform: "Fecal Coliform"
    total_coliform: "Total Coliform"
  # Exact, case-sensitive WQP siteType values for surface water. VERIFY via Codes/Sitetype.
  site_types: [Stream, "Lake, Reservoir, Impoundment", Estuary, Ocean]
  summary_chunk_by: statecode  # one summary request per US state to avoid timeouts
  results_sites_per_request: 50
  results_use_post: true       # POST JSON body with siteid list (long lists fail as GET)
  zip: "yes"
  sorted: "no"

open_meteo:
  docs_url: https://open-meteo.com/en/docs/historical-weather-api
  archive_url: https://archive-api.open-meteo.com/v1/archive
  daily: [precipitation_sum, temperature_2m_mean]
  timezone: UTC
  grid_resolution_deg: 0.25
  min_seconds_between_requests: 1.0
  # Free tier (non-commercial): 10,000 calls/day, 5,000/hour, 600/minute.
  # Long requests count as several calls: weight = locations * (days / 14) * (variables / 10).
  # A run that hits the daily budget stops cleanly (manifest "partial"); the next run resumes.
  max_weighted_calls_per_hour: 4500
  max_weighted_calls_per_day: 9000

natural_earth:
  page_url: https://www.naturalearthdata.com/?p=480
  download_url: https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_1_states_provinces.zip