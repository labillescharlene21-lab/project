# Required raw columns for VAL-1. Observed in ING-1's real run (both OWQ sources share this 9-column schema).
# OWQ CSVs start with leading comment lines before the header (ING-1 finding):
# readers must skip them. VERIFY the prefix in a raw file (first lines of any chunk CSV).
source_code: owq_eionet
data_files: "owq_eionet_*_chunk*.csv"   # which files the column/shape checks apply to (helper files like sampled_sites.csv are skipped)
expected_format: csv
comment_prefix: "#"          # confirmed: 7 leading "#" lines (STG-1)
required_columns:
  - date
  - indicator
  - value
  - unit
  - latitude
  - longitude
  - source
  - region
  - water_body
